# Optional: regenerate CleanSpace.xcodeproj with XcodeGen (`brew install xcodegen && xcodegen`).
# The checked-in project already matches this spec.
name: CleanSpace
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CLEANSPACE_BASE_BUNDLE_ID: com.yourname.cleanspace
    CLEANSPACE_APP_GROUP: group.$(CLEANSPACE_BASE_BUNDLE_ID)
targets:
  CleanSpace:
    type: application
    platform: iOS
    sources:
      - CleanSpace
      - CleanSpaceShared
    dependencies:
      - target: CleanSpaceWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEANSPACE_BASE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CleanSpace.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: CleanSpace
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "CleanSpace looks at your photos and videos on this iPhone to find duplicates, similar shots, screenshots and large videos, and to compress videos you choose. Nothing is uploaded, and nothing is deleted without your approval."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "CleanSpace saves compressed videos and items you take out of the vault to your photo library."
        INFOPLIST_KEY_NSContactsUsageDescription: "CleanSpace compares your contacts on this iPhone to find possible duplicates. Nothing is uploaded, and nothing changes without your approval."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "CleanSpace checks your calendars on this iPhone to find old and duplicate events. Nothing is uploaded, and nothing is deleted without your approval."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "CleanSpace uses Face ID to unlock your private vault."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  CleanSpaceWidget:
    type: app-extension
    platform: iOS
    sources:
      - CleanSpaceWidget
      - CleanSpaceShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEANSPACE_BASE_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/WidgetInfo.plist
        CODE_SIGN_ENTITLEMENTS: Config/CleanSpaceWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: CleanSpace
        SKIP_INSTALL: YES
  CleanSpaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CleanSpaceTests
    dependencies:
      - target: CleanSpace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLEANSPACE_BASE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
